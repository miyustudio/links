<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#51182f">
  <meta name="description" content="Descubre los catálogos y detalles artesanales de Miyu Studio.">
  <title>Miyu Studio | Enlaces</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="hero">
      <div class="hero-meta" aria-label="origen de la marca">
        <span>HECHO A MANO</span>
        <span>PERÚ</span>
      </div>

      <img class="logo" src="logo.png" alt="Miyu Studio">

      <p class="hero-copy">Pequeños detalles, grandes momentos</p>

      <div class="ornament" aria-hidden="true">
        <span></span>
        <i>✦</i>
        <span></span>
      </div>
    </header>

    <section aria-label="Catálogos">
      <div class="section-label">DESCUBRE NUESTRAS COLECCIONES</div>
      <div id="links"></div>
    </section>

    <section id="contact" aria-label="Contacto"></section>

    <footer>
      <div id="socials" aria-label="Redes sociales"></div>
      <p>Creado con cariño, en Lima.</p>
      <small>© <span id="year"></span> Miyu Studio</small>
    </footer>

    <noscript>Activa JavaScript para ver nuestros catálogos.</noscript>
  </main>

  <script src="links.js"></script>
  <script src="app.js"></script>
</body>
</html>
